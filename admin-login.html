<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0E0D0B" />
<title>Administrator Sign In — EPREEM</title>
<link rel="stylesheet" href="css/style.css?v=logo-menu-v2" />
</head>
<body>
<div id="site-header"></div>
<main>
  <div class="auth-shell"><div class="auth-card">
    <span class="eyebrow">Restricted access</span>
    <h1>Administrator sign in</h1>
    <p class="sub">Use an account that has been assigned the administrator role.</p>
    <form id="adminLoginForm" novalidate>
      <div class="field"><label for="email">Email address</label><input id="email" type="email" required autocomplete="email" /></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password" /></div>
      <button class="btn btn-gold btn-block" type="submit">Sign in as administrator</button>
    </form>
    <p class="auth-foot"><a href="login.html">Return to customer sign in</a></p>
  </div></div>
</main>
<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('adminLoginForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  try {
    const { user } = await EpreemAPI.auth.login(email.value.trim(), password.value);
    if (!['admin', 'super_admin'].includes(user.role)) {
      await EpreemAPI.auth.logout();
      throw new Error('This account does not have administrator access.');
    }
    location.href = 'admin-dashboard.html';
  } catch (error) { toast(error.message || 'Administrator sign in failed.'); }
});
</script>
</body>
</html>
